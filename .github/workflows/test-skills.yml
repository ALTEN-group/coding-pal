name: test-skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the skills
        run: node --test skills/*/scripts/*.test.mjs
      - name: Check Persistent Context health
        run: node skills/context-health/scripts/context-lint.mjs --root .
