name: Audit agent - a11y-audit

on:
  workflow_call:
    inputs:
      scope: { type: string, default: 'src/' }

jobs:
  audit:
    uses: 1pizzateam/coding-pal/.github/workflows/audit-runner.yml@main
    with:
      agent: a11y-audit
      scope: ${{ inputs.scope }}
      prompt: 'Ignore stock third-party VitePress theme chrome unless customized in .vitepress/theme/.'
    secrets: inherit
